[package]
name = "web-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
web-ui = { path = "../web-ui" }

[features]
default = ["ssr"]
ssr = ["web-ui/ssr"]
