[package]
name = "avrag-desktop"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Context-OS Client - Tauri 2 desktop shell"
authors = ["Context-OS"]

[lib]
name = "avrag_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5"] }
tracing = "0.1"

# 复用 avrag-rs 核心 crates（轻量 ports，不直接依赖 avrag-rag-core）
common = { path = "../../avrag-rs/crates/common" }
contracts = { path = "../../contracts" }
storage-local = { path = "../../avrag-rs/crates/storage-local" }
machineid-rs = "1.2"
ed25519-dalek = "2"
tauri-plugin-deep-link = "2"
base64 = "0.22"
url = "2"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
# Cloud session path resolution outside command contexts (native_stack
# client.env injection); same dirs major version tauri 2 already uses.
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
