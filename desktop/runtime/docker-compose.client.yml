# Context-OS Client local data plane (full Milvus + Postgres + Redis).
# Ports offset from host defaults to reduce conflicts:
#   Postgres 5433, Redis 6380, Milvus 19530 / metrics 19091
#
# Usage (from monorepo root):
#   bash scripts/desktop-local-stack.sh up
#   bash scripts/desktop-local-stack.sh status
#   bash scripts/desktop-local-stack.sh down
#
# Data volumes: desktop/runtime/data/

name: context-os-client

services:
  etcd:
    container_name: cos-client-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    networks: [cos-client]

  minio:
    container_name: cos-client-milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./data/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    restart: unless-stopped
    networks: [cos-client]

  milvus:
    container_name: cos-client-milvus
    image: milvusdb/milvus:v2.6.14
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./data/milvus:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:19091:9091"
    depends_on:
      - etcd
      - minio
    restart: unless-stopped
    networks: [cos-client]

  postgres:
    container_name: cos-client-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avrag
      POSTGRES_PASSWORD: avrag
      POSTGRES_DB: avrag_client
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    networks: [cos-client]

  redis:
    container_name: cos-client-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    networks: [cos-client]

networks:
  cos-client:
    name: cos-client
