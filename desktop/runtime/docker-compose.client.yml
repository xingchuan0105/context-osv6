# Context-OS Client local data plane (slim):
#   PostgreSQL + pgvector (control plane + VGRAG retrieval) + Redis
# Ports offset from host defaults to reduce conflicts:
#   Postgres 5433, Redis 6380
#
# Retrieval: RETRIEVAL_BACKEND=pgvector (no Milvus / etcd / MinIO).
# Cloud SaaS keeps Milvus; desktop uses storage-pgvector (G1/G2 gated).
#
# Usage (from monorepo root):
#   bash scripts/desktop-local-stack.sh ensure
#   bash scripts/desktop-local-stack.sh status
#   bash scripts/desktop-local-stack.sh down
#
# Data volumes: desktop/runtime/data/
#
# Upgrade note: if this machine previously used postgres:16-alpine without the
# vector extension, recreate the PG volume once:
#   bash scripts/desktop-local-stack.sh down
#   rm -rf desktop/runtime/data/pg
#   bash scripts/desktop-local-stack.sh ensure

name: context-os-client

services:
  postgres:
    container_name: cos-client-postgres
    # Official image with pgvector preinstalled (migration 0060 needs CREATE EXTENSION vector).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: avrag
      POSTGRES_PASSWORD: avrag
      POSTGRES_DB: avrag_client
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    networks: [cos-client]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avrag -d avrag_client"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: cos-client-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./data/redis:/data
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    networks: [cos-client]

networks:
  cos-client:
    name: cos-client
