[package]
name = "desktop-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Context-OS Desktop shared core library (Tauri & GPUI agnostic)"

[dependencies]
contracts = { path = "../../contracts" }
web-sdk = { path = "../../frontend_rust/crates/web-sdk" }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
