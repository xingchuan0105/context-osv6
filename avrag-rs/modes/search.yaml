mode: search
# Search-only: Lead + Web Worker (host multi-query leaf + CRW) → Lead synthesis.
# No DeepSeek/host direct user bubble (D3 / W3).
# Dual shares LeadWorkers via assemble_mode when KB is also mounted.
system_prompt_base: prompts/capabilities/web/contract.md
tool_pool: []
inject_retrieval_query: true
retrieve_strategy: lead_workers
skill_catalog:
  retrieve: [search, memory]
  synthesis: [writing, format, brainstorming]
budget:
  # Host web retrieve does not burn product rounds; headroom for synthesis.
  # Dual takes max(rag, search) — see mode_assemble.
  # No token wall (omit max_tokens → unlimited).
  max_iterations: 2
  baseline_iterations: 0
  by_user_tier:
    free: 2
    pro: 2
    enterprise: 2
temperature: 0.4
loop_exit:
  require_evidence: false
  allow_content_early_stop: false
  # Pack → synthesis; never ship retrieve prose / host DeepSeek text as user bubble.
  skip_synthesis_on_direct_answer: false
  forbid_retrieve_direct_answer: true
  verify: false
  verify_max_fail_rounds: 1
synthesis_output:
  contract: prose_only
auto_fallback:
  enabled: true
  tool_id: web_search
  top_k: 10
  vertical: web
