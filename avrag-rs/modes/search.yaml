mode: search
# SaC: assemble_mode always loads system/agent-base, then
# capabilities/web when 联网 is mounted.
# Internal mode id `search`. Model-facing: 联网 / web. Skill id for thick world model: `search`.
system_prompt_base: prompts/capabilities/web/contract.md
# Empty tool_pool: LLM uses client.web / client.fetch in sandbox. auto_fallback is host-side only.
tool_pool: []
inject_retrieval_query: true
skill_catalog:
  retrieve: [search, memory]
  synthesis: [writing, format]
  # D9: no `mandatory` here — assemble_mode derives it from the capability
  # set (memory base + search when the capability is mounted).
budget:
  max_iterations: 8
  by_user_tier:
    free: 6
    pro: 8
    enterprise: 12
  max_tokens: 16000
  max_tokens_by_user_tier:
    free: 12000
    pro: 16000
    enterprise: 24000
  # continue boost default +50% baseline max_tokens (omit no_chunk_grace_tokens absolute)
# Unified with chat/rag so capability stack does not change sampling policy.
temperature: 0.4
loop_exit:
  # Skill-owned grounding intent only — host does not hard-block DirectAnswer.
  require_evidence: false
  allow_content_early_stop: false
  skip_synthesis_on_direct_answer: true
synthesis_output:
  contract: prose_only
auto_fallback:
  enabled: true
  tool_id: web_search
  top_k: 10
  vertical: web
