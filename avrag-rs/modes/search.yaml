mode: search
# P2 (2026-07-20): main-path system source is capability-search (self-contained);
# monomode search-system retired to prompts/deprecated/monomode-system/.
system_prompt_base: prompts/orchestrators/capability-search.md
tool_pool: [web_search, web_fetch]
inject_retrieval_query: true
skill_catalog:
  retrieve: [search, memory]
  synthesis: [writing, format]
  # PR-A: no monomode search-answer mandatory (worker handoff is final).
  mandatory_synthesis: []
budget:
  max_iterations: 3
  by_user_tier:
    free: 2
    pro: 3
    enterprise: 3
# Unified with chat/rag so capability stack does not change sampling policy.
temperature: 0.4
loop_exit:
  require_evidence: true
  allow_content_early_stop: true
  skip_synthesis_on_direct_answer: true
synthesis_output:
  contract: prose_only
auto_fallback:
  enabled: true
  tool_id: web_search
  top_k: 10
  vertical: web
