mode: rag
# P2 (2026-07-20): main-path system source is capability-rag (self-contained);
# monomode rag-system retired to prompts/deprecated/monomode-system/.
system_prompt_base: prompts/orchestrators/capability-rag.md
# Intentionally empty: retrieve tools are disclosed on-demand via skill clusters
# (codegen/memory). Product capabilities still list auto_fallback.tool_id.
tool_pool: []
inject_retrieval_query: true
skill_catalog:
  retrieve: [codegen, memory, metadata]
  synthesis: [writing, format]
  mandatory:
    retrieve: [codegen]
    # PR-A (2026-07-20): no monomode rag-answer — worker final is handoff JSON
    # (assemble_mode forces ProseOnly + early-stop; see diagnosis prompt-stack).
    synthesis: []
budget:
  max_iterations: 4
  by_user_tier:
    free: 2
    pro: 4
    enterprise: 4
auto_fallback:
  enabled: true
  tool_id: dense_retrieval
  top_k: 10
# Unified with chat/search so capability stack does not change sampling policy.
temperature: 0.4
loop_exit:
  require_evidence: true
  # Handoff JSON can finish the loop without monomode JSON synthesis.
  allow_content_early_stop: true
  skip_synthesis_on_direct_answer: true
synthesis_output:
  # assemble_mode re-asserts ProseOnly for capability paths.
  contract: prose_only
