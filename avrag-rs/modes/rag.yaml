mode: rag
# SaC: assemble_mode always loads system/agent-base, then
# capabilities/knowledge-base when 知识库 (KB) is mounted.
# Internal mode id remains `rag` (config compatibility). Model-facing name: 知识库 / knowledge base.
# system_prompt_base below is a fallback if parts metadata is missing; live path uses multi-part assemble.
system_prompt_base: prompts/capabilities/knowledge-base.md
# Empty tool_pool: LLM uses Python sandbox (client.*). auto_fallback is host-side only.
tool_pool: []
inject_retrieval_query: true
skill_catalog:
  retrieve: [knowledge-base, memory, metadata]
  synthesis: [writing, format]
  mandatory:
    retrieve: [knowledge-base]
    # SaC answers in-loop (ProseOnly); no monomode synthesis skill.
    synthesis: []
budget:
  # Rounds = safety ceiling. Tokens = primary cost budget.
  max_iterations: 12
  by_user_tier:
    free: 8
    pro: 12
    enterprise: 16
  max_tokens: 28000
  max_tokens_by_user_tier:
    free: 16000
    pro: 28000
    enterprise: 40000
auto_fallback:
  # Host recovery only — not exposed as an LLM tool schema under SaC.
  enabled: true
  tool_id: dense_retrieval
  top_k: 10
temperature: 0.4
loop_exit:
  # Skill-owned grounding; host does not hard-block DirectAnswer.
  require_evidence: false
  allow_content_early_stop: false
  skip_synthesis_on_direct_answer: true
synthesis_output:
  contract: prose_only
