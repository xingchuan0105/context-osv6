# RETIRED product mode (SaC A2, 2026-07-30).
# Product entry is single-agent: chat/rag/search via assemble_mode.
# This file remains only so legacy orchestrator brain/tests can still resolve
# budget/temperature if AGENT_ORCHESTRATOR_V2 or structural host re-entry is used.
# Prompt pack lives under prompts/deprecated/orchestrator-multiagent/.
mode: orchestrator
system_prompt_base: prompts/deprecated/orchestrator-multiagent/orchestrator-base.md
tool_pool: []
skill_catalog:
  retrieve: []
  synthesis: []
budget:
  max_iterations: 6
  by_user_tier:
    free: 4
    pro: 6
    enterprise: 8
temperature: 0.4
loop_exit:
  require_evidence: false
  allow_content_early_stop: true
  skip_synthesis_on_direct_answer: true
synthesis_output:
  contract: prose_only
