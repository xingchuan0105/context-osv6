mode: chat
system_prompt_base: prompts/system/agent-base.md
# Base surface: local clock + IP city geo. Pure-chat effective pool is finalized
# in mode_assemble (utility whitelist: user_context + calculator + weather_query).
tool_pool: [user_context]
skill_catalog:
  retrieve: [memory]
  synthesis: [writing, format]
  # agent-base is the pure-chat voice; no mandatory synthesis.
  # writing/format remain optional clusters via DisclosurePlanner.
  mandatory_synthesis: []
budget:
  max_iterations: 4
  by_user_tier:
    free: 3
    pro: 4
    enterprise: 6
  max_tokens: 8000
  max_tokens_by_user_tier:
    free: 6000
    pro: 8000
    enterprise: 12000
# Unified with rag/search so capability stack does not change sampling policy.
temperature: 0.4
loop_exit:
  require_evidence: false
  allow_content_early_stop: true
  skip_synthesis_on_direct_answer: true
synthesis_output:
  contract: prose_only
