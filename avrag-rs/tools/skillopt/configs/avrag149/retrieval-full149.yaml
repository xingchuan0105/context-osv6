# 底层训练（L1.5 代码 + L2 查询）· 全量 149 题慢训
#
# prompt_target = knowledge-base SKILL（方法表 / 并行扇出 / 返回形状 / 策略指针）
# include_ids 空 = 加载黄金集全部 149 题；组合 subset 仍整族 holdout 进 test（防记忆化）
# rollout 环境由 scripts/run-skillopt-retrieval-full149.sh 注入双通道 Flash
_base_: default.yaml

train:
  num_epochs: 2
  batch_size: 8

gradient:
  minibatch_size: 8
  merge_batch_size: 8

env:
  prompt_target: capabilities/knowledge-base/SKILL.md
  skill_init: avrag149/skills/knowledge-base.md
  include_ids_file: ""            # 全量 149（不截断题号白名单）
  holdout_subsets: "cross_document,ipd_table,rag_search_joint,cross_adr,orchestrator_paradigm"
  eval_workers: 1
  eval_timeout_secs: 7200         # 单 batch 最多 2h
  reflect_backend: llm
