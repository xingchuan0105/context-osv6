# avrag149 SkillOpt 配置 — 优化 avrag-rs 的 prompts/system/agent-base.md
#
# 自包含完整配置（不继承 skillopt 包内 base），版本可复现。
# 凭据一律走环境变量（不写进本文件）：
#   QWEN_CHAT_BASE_URL / QWEN_CHAT_API_KEY / QWEN_CHAT_MODEL
# train_avrag149.py 会自动从 avrag-rs/.env 的 AGENT_LLM_*（DeepSeek）回填。

model:
  backend: qwen_chat            # optimizer + target 统一走 qwen_chat（OpenAI 兼容协议）
  optimizer: ""                 # 留空 → QWEN_CHAT_MODEL（deepseek 模型）
  optimizer_backend: qwen_chat
  target: ""                    # target 由产品评测链路承担（AGENT_LLM_*/E2E_LLM_*），此处仅占位
  target_backend: qwen_chat
  reasoning_effort: medium
  rewrite_max_completion_tokens: 64000

train:
  num_epochs: 4
  batch_size: 16                # 每步 = 一次 E2E_QUESTIONS 子集评测（题数 = minibatch）
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8             # reflect 的批大小（≤ batch_size）
  merge_batch_size: 8
  analyst_workers: 8
  max_analyst_rounds: 3
  failure_only: false

optimizer:
  learning_rate: 4              # 每步最多编辑条数（edit_budget）
  min_learning_rate: 2
  lr_scheduler: cosine
  skill_update_mode: patch
  use_slow_update: true
  use_meta_skill: true
  use_skill_aware_reflection: false

evaluation:
  use_gate: true                # 候选 skill 必须严格提升 held-out(val) 分数才接受
  sel_env_num: 0                # 0 = val 全集作 selection split
  test_env_num: 0               # 0 = test 全集作最终验收
  eval_test: true

env:
  name: avrag149
  skill_init: avrag149/skills/initial.md   # 起点 = 当前 prompts/system/agent-base.md 拷贝
  # WP1（2026-08-02）:per-family split——subset 族内 7:2:1 + 整族留出。
  # 防记忆化结构性 holdout(D6-②):组合 subset 的答案永不进训练/反射视野。
  split_mode: per_family
  split_ratio: "7:2:1"          # 族内比例;holdout 整族进 test
  split_seed: 42
  # 组合 subset 整族留出(组合回归门禁,训单 skill 绝不在这上面倒退)
  holdout_subsets: "cross_document,ipd_table,rag_search_joint,cross_adr,orchestrator_paradigm"
  data_path: ""                 # 留空 → <avrag_rs_root>/tests/rag_quality/golden_set_realistic.json
  avrag_rs_root: ""             # 留空 → 自动推断为仓库 avrag-rs 根
  prompt_target: system/agent-base.md   # 被优化/替换的 prompts 内文件（相对 prompts/）
  # 精简集(2026-08-01):题号白名单(错题 ∪ 各题型代表题,65 题);空 → 全量 149
  include_ids_file: avrag149/question_ids_include.json
  workers: 4
  # WP2（2026-08-02）:rollout 并行 worker 数。>1 时单个 batch 切分为 eval_workers
  # 块并行跑（每块独立 prompt 树 + 独立评测输出目录，并发安全）。
  # 默认 1 = 串行（语义不变）；开并行前确认 WSL jobs=2 与共享服务吞吐。
  eval_workers: 1
  max_completion_tokens: 4096
  eval_timeout_secs: 3600
  limit: 0
