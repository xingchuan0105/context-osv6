[package]
name = "avrag-rag-core"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
contracts = { path = "../../../contracts" }
anyhow.workspace = true
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tiktoken-rs.workspace = true
uuid.workspace = true
rayon.workspace = true
tracing = "0.1"
thiserror.workspace = true
futures-util = "0.3"
sha2.workspace = true
hex.workspace = true
regex.workspace = true
# struct_query: per-doc DuckDB 表格存储只读查询(docs/plans/2026-07-31-struct-query-virtual-tables.md)
duckdb = { version = "1", features = ["bundled"] }
# Internal — no avrag-llm / avrag-cache-redis (Wave 5 ports)
avrag-rag-core-ports = { path = "../rag-core-ports" }
common = { path = "../common" }
avrag-retrieval-data-plane = { path = "../retrieval-data-plane" }
avrag-code-interpreter = { path = "../code-interpreter" }

[dev-dependencies]
insta.workspace = true
avrag-storage-pgvector = { path = "../storage-pgvector" }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "chrono", "json", "macros"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
async-trait.workspace = true
