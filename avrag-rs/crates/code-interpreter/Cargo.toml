[package]
name = "avrag-code-interpreter"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
contracts = { path = "../../../contracts" }
libc = "0.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# Sandbox process-tree kill + limits on Windows: Job Object (KILL_ON_JOB_CLOSE,
# TerminateJobObject on timeout, memory/CPU limits) — mirrors unix killpg+rlimit.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
