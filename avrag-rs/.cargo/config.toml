include = [{ path = "local-machine.toml", optional = true }]

# Cap rustc parallelism for WSL / ~16G RAM. Full-core default thrashs multi-GB targets.
# Override: CARGO_BUILD_JOBS=N  or  local-machine.toml  [build] jobs = N
[build]
jobs = 2

[env]
# DuckDB's bundled C++ unity files exceed standard COFF section limits.
# Scope the assembler flag to MinGW C++ builds; native/MSVC builds are unchanged.
CXXFLAGS_x86_64_pc_windows_gnu = "-Wa,-mbig-obj"

[target.x86_64-pc-windows-gnu]
# WSL cross-build: keep MinGW C++ callback/TLS state inside the executable.
linker = "../scripts/link-windows-gnu.sh"

[alias]
test-app = ["test", "-p", "app", "--message-format=short"]
