# Include inside the app.contextlm.top HTTPS server block (or conf.d).
# Serves versioned desktop installers + latest.json for /desktop download UI.
#
# On VPS:
#   mkdir -p /var/www/releases/desktop
#   # merge into app-contextlm.conf server { ... }

location /releases/desktop/ {
    alias /var/www/releases/desktop/;
    autoindex off;
    # Versioned artifacts: long cache
    location ~* /releases/desktop/v[0-9] {
        alias /var/www/releases/desktop/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# latest.json: short cache so publish is visible quickly
location = /releases/desktop/latest.json {
    alias /var/www/releases/desktop/latest.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=60";
    add_header Access-Control-Allow-Origin "*";
}
