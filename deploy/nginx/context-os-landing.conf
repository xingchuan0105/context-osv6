# www → apex 301（GEO：消除双 host 重复内容，权重归一）
server {
    listen 443 ssl http2;
    server_name www.contextlm.top;

    access_log /var/log/nginx/access.log ctxlm;

    ssl_certificate /etc/letsencrypt/live/blog.contextlm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.contextlm.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://contextlm.top$request_uri;
}

server {
    listen 443 ssl http2;
    server_name contextlm.top;

    access_log /var/log/nginx/access.log ctxlm;

    # Use the same SSL certificate as blog.contextlm.top
    # (contextlm.top and blog.contextlm.top share the same cert)
    ssl_certificate /etc/letsencrypt/live/blog.contextlm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.contextlm.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/context-os-landing;
    index index.html;

    include /etc/nginx/snippets/scanner-block.conf;

    # robots/sitemap change often during GEO work; avoid multi-hour CF HIT on stale Allow lists
    location = /robots.txt {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
