upstream elo_web {
    server 127.0.0.1:3110;
    keepalive 32;
}

server {
    listen 80;
    server_name elo.contextlm.top;
    access_log /var/log/nginx/access.log ctxlm;
    include /etc/nginx/snippets/scanner-block.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name elo.contextlm.top;
    include /etc/nginx/snippets/scanner-block.conf;

    # 与站内其它子域相同的通配证书
    ssl_certificate     /etc/nginx/ssl/contextlm.top.pem;
    ssl_certificate_key /etc/nginx/ssl/contextlm.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/elo-access.log ctxlm;
    error_log  /var/log/nginx/elo-error.log;

    client_max_body_size 8M;

    # Next rewrites /api/v1 → Nest; browser only hits web origin
    location / {
        proxy_pass http://elo_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
