# Host-tagged access log format shared by all contextlm vhosts.
# conf.d is included alphabetically, so this file defines the format before
# any server block references it. Field 1 is $host (per-domain traffic
# split); cf= carries the real client IP behind Cloudflare, "-" when direct.
log_format ctxlm '$host $remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" '
                 '"$http_user_agent" cf=$http_cf_connecting_ip';
