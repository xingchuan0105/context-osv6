server {
    server_name blog.contextlm.top;

    access_log /var/log/nginx/access.log ctxlm;

    client_max_body_size 50m;

    include /etc/nginx/snippets/scanner-block.conf;

    # GEO: llms.txt for AI crawlers
    location = /llms.txt {
        default_type text/plain;
        return 200 '# blog.contextlm.top — 创作者博客
> 开发者邢川的观点与观察：商业、技术与社会。ContextLM 旗下创作空间。

## 内容方向
- 商业分析（Palantir 式垄断、网络效应系列、企业组织）
- 技术思考（AI、知识工作）
- 全文 RSS：https://blog.contextlm.top/rss/

## 开发者
- 邢川 — https://github.com/xingchuan0105 · https://x.com/cHuaNXiNg105
- ContextLM 品牌站：https://contextlm.top/
';
    }

    location / {
        proxy_pass http://127.0.0.1:2368;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/blog.contextlm.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/blog.contextlm.top/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/access.log ctxlm;
    return 301 http://blog.contextlm.top$request_uri;
}
server {
    if ($host = blog.contextlm.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name blog.contextlm.top;
    access_log /var/log/nginx/access.log ctxlm;
    return 404; # managed by Certbot


}