server {
    listen 80;
    server_name app.contextlm.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.contextlm.top;

    ssl_certificate /etc/nginx/ssl/contextlm.top.pem;
    ssl_certificate_key /etc/nginx/ssl/contextlm.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;


    # Desktop installers (static)
    location /releases/desktop/ {
        alias /var/www/releases/desktop/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
    }

    location = /releases/desktop/latest.json {
        alias /var/www/releases/desktop/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
