server {
    listen 80;
    server_name app.contextlm.top;

    access_log /var/log/nginx/access.log ctxlm;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.contextlm.top;

    ssl_certificate /etc/nginx/ssl/contextlm.top.pem;
    ssl_certificate_key /etc/nginx/ssl/contextlm.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    access_log /var/log/nginx/access.log ctxlm;

    include /etc/nginx/snippets/scanner-block.conf;

    # Maintenance gate (scripts/deploy 维护窗口): when /etc/avrag-rs/maintenance.on
    # exists every public path 503s except /health (localhost acceptance keeps
    # working through 127.0.0.1:8081 directly).
    include /etc/nginx/snippets/avrag-maintenance.conf;

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/maintenance;
        try_files /index.html =503;
        add_header Retry-After 300 always;
    }

    # GEO: llms.txt for AI crawlers (served here to avoid a full FE deploy for one file)
    location = /llms.txt {
        default_type text/plain;
        return 200 '# Context OS

