server {
    listen 80;
    server_name app.contextlm.top;

    access_log /var/log/nginx/access.log ctxlm;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.contextlm.top;

    ssl_certificate /etc/nginx/ssl/contextlm.top.pem;
    ssl_certificate_key /etc/nginx/ssl/contextlm.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    access_log /var/log/nginx/access.log ctxlm;

    include /etc/nginx/snippets/scanner-block.conf;

    # GEO: llms.txt for AI crawlers (served here to avoid a full FE deploy for one file)
    location = /llms.txt {
        default_type text/plain;
        return 200 '# Context OS (app.contextlm.top)
> Agentic 知识工作台。ContextLM 旗下产品。

## 是什么
- 以私有知识库为中心的第二大脑工作台：入库、检索、加工、再创作一体完成
- Agentic 检索：会规划的 Agent 按问题调度多条互补检索通路（dense/lexical/grep），非一次性向量匹配
- 知识库只读对话式分享：内容保密，读者可与你分享的知识库聊天
- 计费：免费注册；BYOK 自带模型 key 按量自理，或平台充值即充即用（/pricing）
- Windows 客户端下载：/desktop

## 帮助
- API 接入：/help/api-access
- FAQ：/help/faq
- 产品对比：/help/compare
- 法律条款：/legal/terms · /legal/privacy

## 相关
- 品牌母站：https://contextlm.top/
- sitemap: https://app.contextlm.top/sitemap.xml
';
    }

    # Desktop installers (static)
    location /releases/desktop/ {
        alias /var/www/releases/desktop/;
        autoindex off;
        add_header Cache-Control "public, max-age=300";
    }

    location = /releases/desktop/latest.json {
        alias /var/www/releases/desktop/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=60";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Desktop official-key relay (W2): OpenAI-compatible /v1/relay/* on avrag-api.
    # SSE 透传 — buffering must stay off or chat streaming stalls.
    location /v1/relay/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Signed document upload PUT (create-document returns https://host/uploads/{id}?…)
    # Must hit avrag-api — never Next.js (otherwise browser gets HTML 404).
    location /uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 100M;
    }

    # Creem / Alipay async notify (must hit avrag-api, not Next.js)
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
