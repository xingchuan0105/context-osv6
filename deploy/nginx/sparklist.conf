# Sparklist Weekly / 点子王周报
# Install: APPLY_NGINX=1 bash scripts/deploy-vps.sh
# Requires DNS A/AAAA for sparklist.contextlm.top → VPS
# Cert: reuse contextlm cert or issue via certbot for this host

server {
    listen 80;
    server_name sparklist.contextlm.top;
    access_log /var/log/nginx/access.log ctxlm;
    include /etc/nginx/snippets/scanner-block.conf;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sparklist.contextlm.top;
    include /etc/nginx/snippets/scanner-block.conf;

    access_log /var/log/nginx/access.log ctxlm;

    # Prefer dedicated cert; fall back to existing contextlm cert if shared
    ssl_certificate /etc/letsencrypt/live/blog.contextlm.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.contextlm.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sparklist;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache static lightly
    location ~* \.(css|js|ico|png|jpg|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
