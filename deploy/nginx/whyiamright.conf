upstream whyiamright_frontend {
    server 127.0.0.1:3004;
    keepalive 64;
}

upstream whyiamright_backend {
    server 127.0.0.1:8082;
    keepalive 64;
}

server {
    listen 80;
    server_name whyimright.contextlm.top;
    access_log /var/log/nginx/access.log ctxlm;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name whyimright.contextlm.top;

    ssl_certificate /etc/nginx/ssl/contextlm.top.pem;
    ssl_certificate_key /etc/nginx/ssl/contextlm.top.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/whyiamright-access.log ctxlm;
    error_log /var/log/nginx/whyiamright-error.log;

    client_max_body_size 100M;

    include /etc/nginx/snippets/scanner-block.conf;

    location /api/ {
        proxy_pass http://whyiamright_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://whyiamright_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
