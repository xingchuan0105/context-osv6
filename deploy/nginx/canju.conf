server {
    if ($host = canju.contextlm.top) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name canju.contextlm.top;
    return 301 https://$host$request_uri;


}

server {
    listen 443 ssl http2;
    server_name canju.contextlm.top;

    # certbot 会自动注入 ssl_certificate / ssl_certificate_key

    root /var/www/canju;
    index index.html;

    # SSE 必须关闭缓冲
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    ssl_certificate /etc/letsencrypt/live/canju.contextlm.top/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/canju.contextlm.top/privkey.pem; # managed by Certbot
}