# Drop vulnerability-scanner noise silently (hundreds of 404s/day otherwise).
# No site in this fleet serves PHP or WordPress.
location ~* ^/wp-(admin|content|login|includes|json)|^/wordpress/ { return 444; }
location ~* \.php$ { return 444; }
location ~* /\.(env|git|htaccess|htpasswd|aws|DS_Store)(/|$) { return 444; }
