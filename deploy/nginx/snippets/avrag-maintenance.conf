# Maintenance gate for app.contextlm.top — included by app-contextlm.conf.
# With /etc/avrag-rs/maintenance.on present, every request except /health
# returns 503 (page + Retry-After via error_page @maintenance).
set $maintenance 0;
if (-f /etc/avrag-rs/maintenance.on) {
    set $maintenance 1;
}
if ($request_uri = /health) {
    set $maintenance 0;
}