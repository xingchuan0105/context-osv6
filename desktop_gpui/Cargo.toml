[package]
name = "desktop-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Context-OS desktop UI (GPUI). Independent workspace; not a member of avrag-rs."

[dependencies]
contracts = { path = "../contracts" }
web-sdk = { path = "../frontend_rust/crates/web-sdk" }
serde_json = "1.0.145"
desktop-core = { path = "../desktop/core" }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net"] }
tokio-util = "0.7"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "d2304b9063b902fc7ac19b97a7cb5bf3e650b4f5", optional = true }

[features]
default = []
ui = ["dep:gpui-kit"]

[[bin]]
name = "desktop-gpui"
path = "src/main.rs"
required-features = ["ui"]

[profile.dev]
debug = 0

# Execute the original shared Tauri transport suite against GPUI's locked dependencies.
[[test]]
name = "shared_desktop_stream"
path = "../desktop/core/tests/chat_stream_tests.rs"
