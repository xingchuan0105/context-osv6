<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Context-OS · 布局样稿</title><link rel="stylesheet" href="screen.css"></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none"><defs>
<symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></symbol><symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 15a3 3 0 0 1-3 3H8l-5 3V6a3 3 0 0 1 3-3h11a3 3 0 0 1 3 3z"/></symbol><symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5h7l2 3h9v12H3z"/></symbol><symbol id="i-clip" viewBox="0 0 24 24"><path d="m8 12 6-6a4 4 0 0 1 6 6l-9 9a6 6 0 0 1-8-8l10-10M7 15l9-9m-9 9a2 2 0 0 0 3 3l8-8"/></symbol><symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol><symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="i-bell" viewBox="0 0 24 24"><path d="M5 17h14l-2-3V9a5 5 0 0 0-10 0v5zM10 21h4"/></symbol><symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol><symbol id="i-file" viewBox="0 0 24 24"><path d="M5 3h9l5 5v13H5zM14 3v6h5M9 13h6M9 17h6"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="i-arrow" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6"/></symbol>
</defs></svg>
<div class="app" id="app">
<aside class="rail" id="rail" aria-label="主导航">
<div class="rail-head"><span class="brand">Context<span>·</span>OS</span><button class="icon" id="collapse" aria-label="折叠导航" title="折叠导航"><svg><use href="#i-panel"/></svg></button></div>
<nav><button class="nav-row" data-scene="empty" title="新对话"><svg><use href="#i-plus"/></svg><span>新对话</span></button><button class="nav-row" data-scene="workspace" title="工作区"><svg><use href="#i-folder"/></svg><span>工作区</span></button></nav>
<div class="recent"><p class="eyebrow" id="recent-label">最近对话</p><button class="history" data-scene="conversation">梳理下周的工作重点</button><button class="history" data-scene="attachment">分析季度业务数据</button><button class="history" data-scene="workspace">产品研究 <small>工作区</small></button></div>
<div class="rail-bottom"><button class="nav-row" id="account" title="账户与设置"><span class="avatar">C</span><span>我的账户<small>个人空间</small></span><span class="chevron">⌄</span></button></div>
</aside>
<section class="main">
<header class="topbar"><button class="icon mobile-menu" id="mobile-menu" aria-label="打开导航"><svg><use href="#i-panel"/></svg></button><div class="context"><span id="context-title">新对话</span><small id="context-subtitle"></small></div><div class="top-actions"><button class="pill" id="sources" hidden><svg><use href="#i-folder"/></svg>资料 <span class="count">3</span></button><button class="pill" id="share" hidden>分享</button><button class="icon" id="notifications" aria-label="通知"><svg><use href="#i-bell"/></svg></button></div></header>
<div class="body-area"><main id="canvas" class="canvas"><section id="messages" class="messages" aria-label="对话内容"></section><div id="intro" class="intro"><div class="wordmark">Context<span>·</span>OS</div><h1>有什么可以帮你？</h1></div>
<div class="composer-wrap" id="composer-wrap"><form class="composer" id="composer"><div id="attachments" class="attachments" hidden></div><label class="sr-only" for="prompt">输入消息</label><textarea id="prompt" rows="2" placeholder="输入问题，或添加文件…"></textarea><div class="tools"><button type="button" class="icon" id="attach" aria-label="添加本轮附件" title="添加文件，仅用于本轮对话"><svg><use href="#i-clip"/></svg></button><button type="button" class="pill" id="web" aria-pressed="false" title="联网搜索"><svg><use href="#i-globe"/></svg><span>联网</span></button><span class="spacer"></span><button type="button" class="model" id="model">默认模型 <span>⌄</span></button><button class="icon send" id="send" aria-label="发送消息" disabled><svg><use href="#i-up"/></svg></button></div></form><p class="composer-note" id="composer-note">附件仅用于本轮对话</p></div></main>
<aside class="sources" id="source-panel" aria-label="工作区资料" hidden><div class="panel-heading"><h2>工作区资料</h2><button class="icon" id="close-sources" aria-label="关闭资料"><svg><use href="#i-close"/></svg></button></div><p class="muted">资料保存在「产品研究」，可持续用于工作区问答。</p><button class="outline" id="upload-workspace"><svg><use href="#i-plus"/></svg>添加资料</button><div class="source-list"><div><svg><use href="#i-file"/></svg><span>用户访谈纪要.docx<small>已就绪 · 12 页</small></span></div><div><svg><use href="#i-file"/></svg><span>竞品分析.xlsx<small>已就绪 · 3 张工作表</small></span></div><div><svg><use href="#i-file"/></svg><span>产品规划.pptx<small>处理中 · 正在解析</small></span></div></div><div class="panel-note">资料状态与来源始终可查；收起面板可获得更宽的阅读空间。</div></aside>
</div></section></div>
<div id="backdrop" class="backdrop" hidden></div><div id="popover" class="popover" role="dialog" aria-label="操作菜单" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<script src="screen.js"></script></body></html>
